[project]
name = "pulseguard-api"
version = "0.1.0"
description = "Synthetic-data API for the PulseGuard hackathon prototype."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "numpy>=1.26.0,<2.0.0",  # shap 0.45's C extension is compiled against NumPy 1.x
  "scikit-learn>=1.5.0,<2.0.0",
  "xgboost>=2.0.0,<2.1.0",  # 2.1+ serializes base_score as a bracketed string that shap 0.46 cannot parse
  "shap>=0.46.0,<0.47.0",  # 0.46+ supports xgboost 2.x/3.x; requires the modern numba pinned below
  "numba>=0.61.0",  # shap pulls numba; force a version with Python 3.12 wheels
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
